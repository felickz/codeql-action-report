name: 'CodeQL SARIF Report'
description: 'Generate and upload SARIF HTML reports from CodeQL analysis'
author: 'felickz'
branding:
  icon: 'file-text'
  color: 'blue'

inputs:
  sarif-input:
    description: 'Path to the SARIF output directory. Defaults to CODEQL_ACTION_SARIF_RESULTS_OUTPUT_DIR environment variable set by codeql-action.'
    required: false
  features:
    description: |
      Security and compliance features to enable. Format: YAML multi-line string with feature flags.
      Available features:
        - advanced-security: Check GitHub Advanced Security status (default: true)
        - scorecard: Run OpenSSF Scorecard analysis (default: true)
        - sbom: Generate and attest SBOM (default: true, already implemented)
      Example:
        features: |
          advanced-security: true
          scorecard: true
          sbom: true
    required: false
    default: |
      advanced-security: true
      scorecard: true
      sbom: true

runs:
  using: 'composite'
  steps:
    - name: Install sarif-tools
      shell: bash
      run: |
        pip install -r ${{ github.action_path }}/requirements.txt

    - name: Set environment variables
      shell: bash
      env:
        INPUT_FEATURES: ${{ inputs.features }}
      run: |
        REPO_NAME="$(echo '${{ github.repository }}' | tr '/' '-')"
        echo "REPO_NAME=$REPO_NAME" >> $GITHUB_ENV
        
        # Parse features input and set feature flags
        # NOTE: This is a simple key:value parser. For complex YAML, consider using yq.
        # Expected format: "key: value" pairs, one per line
        # Default all features to true if not specified
        FEATURE_ADVANCED_SECURITY="true"
        FEATURE_SCORECARD="true"
        FEATURE_SBOM="true"
        
        if [ -n "$INPUT_FEATURES" ]; then
          # Parse YAML-style features input (simple key:value format only)
          while IFS=: read -r key value; do
            # Trim whitespace
            key=$(echo "$key" | xargs)
            value=$(echo "$value" | xargs)
            
            case "$key" in
              "advanced-security")
                FEATURE_ADVANCED_SECURITY="$value"
                ;;
              "scorecard")
                FEATURE_SCORECARD="$value"
                ;;
              "sbom")
                FEATURE_SBOM="$value"
                ;;
            esac
          done <<< "$INPUT_FEATURES"
        fi
        
        echo "FEATURE_ADVANCED_SECURITY=$FEATURE_ADVANCED_SECURITY" >> $GITHUB_ENV
        echo "FEATURE_SCORECARD=$FEATURE_SCORECARD" >> $GITHUB_ENV
        echo "FEATURE_SBOM=$FEATURE_SBOM" >> $GITHUB_ENV
        
        echo "Features enabled:"
        echo "  - Advanced Security: $FEATURE_ADVANCED_SECURITY"
        echo "  - Scorecard: $FEATURE_SCORECARD"
        echo "  - SBOM: $FEATURE_SBOM"

    - name: Fetch Advanced Security Status
      id: advanced-security
      if: env.FEATURE_ADVANCED_SECURITY == 'true'
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        
        echo "Fetching Advanced Security status for ${{ github.repository }}..."
        
        # Create output directory for security reports
        mkdir -p security-reports
        
        # Fetch repository information with security_and_analysis
        echo "Fetching repository security features..."
        gh api /repos/${{ github.repository }} > security-reports/repo-info-temp.json
        
        # Extract security_and_analysis section
        jq '.security_and_analysis' security-reports/repo-info-temp.json > security-reports/security-and-analysis.json
        
        # Check Dependabot vulnerability alerts status
        echo "Checking Dependabot vulnerability alerts..."
        VULN_ALERTS_STATUS="unknown"
        if gh api /repos/${{ github.repository }}/vulnerability-alerts --silent 2>/dev/null; then
          VULN_ALERTS_STATUS="enabled"
        else
          VULN_ALERTS_STATUS="disabled"
        fi
        echo "{\"enabled\": $([ "$VULN_ALERTS_STATUS" = "enabled" ] && echo "true" || echo "false")}" > security-reports/vulnerability-alerts.json
        
        # Check Dependabot automated security fixes
        echo "Checking Dependabot automated security fixes..."
        if gh api /repos/${{ github.repository }}/automated-security-fixes > security-reports/automated-security-fixes.json 2>/dev/null; then
          echo "Automated security fixes status retrieved"
        else
          echo "{\"enabled\": false, \"paused\": false}" > security-reports/automated-security-fixes.json
        fi
        
        # Combine all security information into a single JSON file
        echo "Generating combined security status report..."
        jq -n \
          --arg repo "${{ github.repository }}" \
          --arg timestamp "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" \
          --argjson security_analysis "$(cat security-reports/security-and-analysis.json)" \
          --argjson vuln_alerts "$(cat security-reports/vulnerability-alerts.json)" \
          --argjson auto_fixes "$(cat security-reports/automated-security-fixes.json)" \
          '{
            repository: $repo,
            timestamp: $timestamp,
            security_and_analysis: $security_analysis,
            vulnerability_alerts: $vuln_alerts,
            automated_security_fixes: $auto_fixes
          }' > security-reports/advanced-security-status.json
        
        # Clean up temporary files
        rm -f security-reports/repo-info-temp.json
        
        echo "✅ Advanced Security status fetched successfully"
        cat security-reports/advanced-security-status.json

    - name: Run OpenSSF Scorecard
      id: scorecard
      if: env.FEATURE_SCORECARD == 'true'
      continue-on-error: true
      shell: bash
      env:
        GITHUB_AUTH_TOKEN: ${{ github.token }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        
        echo "Installing OpenSSF Scorecard CLI..."
        
        # Get latest release information using gh api
        RELEASE_INFO=$(gh api /repos/ossf/scorecard/releases/latest)
        VERSION=$(echo "$RELEASE_INFO" | jq -r '.tag_name')
        echo "Using Scorecard version: ${VERSION}"
        
        # Download and install scorecard
        DOWNLOAD_URL="https://github.com/ossf/scorecard/releases/download/${VERSION}/scorecard_${VERSION#v}_linux_amd64.tar.gz"
        echo "Downloading from: $DOWNLOAD_URL"
        
        curl -sSfL "$DOWNLOAD_URL" -o scorecard.tgz
        
        # Note: Checksum verification would require downloading the checksums file and verifying
        # For now, we rely on HTTPS and the official GitHub releases
        
        tar -xzf scorecard.tgz scorecard
        sudo mv scorecard /usr/local/bin/scorecard
        rm scorecard.tgz
        
        scorecard version
        
        # Create output directory
        mkdir -p security-reports
        
        # Run Scorecard with JSON output
        echo "Running OpenSSF Scorecard analysis..."
        scorecard \
          --repo "github.com/${{ github.repository }}" \
          --format json \
          --output security-reports/scorecard-results.json \
          --show-details
        
        # Generate Markdown summary from JSON
        echo "Generating Scorecard markdown summary..."
        
        SUMMARY_FILE="security-reports/scorecard-summary.md"
        
        {
          echo "# OpenSSF Scorecard"
          echo
          echo "- Repo: \`${{ github.repository }}\`"
          echo "- Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo
          
          SCORE="$(jq -r '.score // empty' security-reports/scorecard-results.json)"
          DATE="$(jq -r '.date // empty' security-reports/scorecard-results.json)"
          SC_VERSION="$(jq -r '.scorecard.version // empty' security-reports/scorecard-results.json)"
          
          if [ -n "$SCORE" ]; then
            echo "## Overall"
            echo
            echo "**Score:** \`${SCORE}\`"
            [ -n "$DATE" ] && echo "- Date: \`${DATE}\`"
            [ -n "$SC_VERSION" ] && echo "- Scorecard version: \`${SC_VERSION}\`"
            echo
          fi
          
          echo "## Checks"
          echo
          echo "| Check | Score | Reason |"
          echo "|---|---:|---|"
          jq -r '.checks[]
            | [
                .name,
                (.score|tostring),
                (.reason | gsub("[\\r\\n]+";" ") | gsub("\\|"; "\\\\|") )
              ]
            | @tsv' security-reports/scorecard-results.json \
          | while IFS=$'\t' read -r name score reason; do
              printf '| %s | %s | %s |\n' "$name" "$score" "$reason"
            done
        } > "$SUMMARY_FILE"
        
        echo "✅ OpenSSF Scorecard analysis completed successfully"
        echo "Summary saved to $SUMMARY_FILE"


    - name: Generate SARIF HTML reports
      shell: bash
      env:
        INPUT_SARIF_DIR: ${{ inputs.sarif-input }}
      run: |
        SARIF_DIR="$INPUT_SARIF_DIR"
        if [ -z "$SARIF_DIR" ]; then
          SARIF_DIR="${CODEQL_ACTION_SARIF_RESULTS_OUTPUT_DIR}"
        fi

        if [ -z "$SARIF_DIR" ]; then
          echo "Error: No SARIF directory specified and CODEQL_ACTION_SARIF_RESULTS_OUTPUT_DIR is not set"
          exit 1
        fi

        if [ ! -d "$SARIF_DIR" ]; then
          echo "Error: SARIF directory not found: $SARIF_DIR"
          exit 1
        fi

        FOUND_FILES=0
        while IFS= read -r -d '' SARIF_FILE; do
          BASENAME=$(basename "$SARIF_FILE" .sarif)
          echo "Generating HTML report for $SARIF_FILE"
          sarif html --output "./sarif_${BASENAME}.html" --no-autotrim "$SARIF_FILE"
          FOUND_FILES=1
        done < <(find "$SARIF_DIR" -maxdepth 1 -name "*.sarif" -type f -print0)

        if [ "$FOUND_FILES" -eq 0 ]; then
          echo "No .sarif files found in $SARIF_DIR"
          exit 1
        fi

    - name: Upload SARIF HTML reports
      id: upload-sarif-html
      uses: actions/upload-artifact@v5
      with:
        name: ${{ env.REPO_NAME }}-${{github.sha}}-sarif-html-reports
        path: sarif_*.html
        if-no-files-found: warn

    - name: Copy SARIF files to workspace
      shell: bash
      env:
        INPUT_SARIF_DIR: ${{ inputs.sarif-input }}
      run: |
        SARIF_DIR="$INPUT_SARIF_DIR"
        if [ -z "$SARIF_DIR" ]; then
          SARIF_DIR="${CODEQL_ACTION_SARIF_RESULTS_OUTPUT_DIR}"
        fi

        # Copy SARIF files to current directory for upload
        if [ -d "$SARIF_DIR" ]; then
          cp "$SARIF_DIR"/*.sarif . 2>/dev/null || true
        fi

    - name: Upload SARIF files
      id: upload-sarif
      uses: actions/upload-artifact@v5
      with:
        name: ${{ env.REPO_NAME }}-${{github.sha}}-sarif
        path: "*.sarif"
        if-no-files-found: warn

    - name: Generate SBOM
      id: generate-sbom
      if: env.FEATURE_SBOM == 'true'
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        echo "Attempting to fetch SBOM from GitHub API..."
        TEMP_FILE="sbom-temp.json"
        ERROR_OUTPUT=$(gh api /repos/${{ github.repository }}/dependency-graph/sbom 2>&1 > "$TEMP_FILE")
        EXIT_CODE=$?

        if [ $EXIT_CODE -ne 0 ]; then
          echo "::error::API call failed with exit code $EXIT_CODE"
          echo "::error::Error details: $ERROR_OUTPUT"
          echo "::warning::Failed to generate SBOM. The dependency graph may not be enabled for this repository."
          echo "::warning::Check: Repository Settings > Security > Dependency graph must be enabled"
          exit 1
        fi

        # Extract the SBOM from the API response (it's nested in a "sbom" key)
        jq '.sbom' "$TEMP_FILE" > "sbom.spdx.json"
        rm "$TEMP_FILE"
        echo "SBOM generated successfully"

    - name: Upload SBOM
      id: upload-sbom
      if: steps.generate-sbom.outcome == 'success'
      uses: actions/upload-artifact@v5
      with:
        name: ${{ env.REPO_NAME }}-${{github.sha}}-sbom
        path: sbom.spdx.json
        if-no-files-found: warn

    - name: Upload Security Reports
      id: upload-security-reports
      if: steps.advanced-security.outcome == 'success' || steps.scorecard.outcome == 'success'
      uses: actions/upload-artifact@v5
      with:
        name: ${{ env.REPO_NAME }}-${{github.sha}}-security-reports
        path: security-reports/
        if-no-files-found: warn

    - name: Attest Report and SARIF with SBOM
      id: attest-sbom
      if: steps.generate-sbom.outcome == 'success'
      uses: actions/attest-sbom@v3
      with:
        subject-path: |
          sarif_*.html
          *.sarif
          security-reports/*.json
        sbom-path: sbom.spdx.json
        show-summary: false # we report in the final summary

    - name: Attest Report and SARIF
      id: attest-provenance
      if: steps.generate-sbom.outcome != 'success'
      uses: actions/attest-build-provenance@v3
      with:
        subject-path: |
          sarif_*.html
          *.sarif
          security-reports/*.json
        show-summary: false # we report in the final summary

    - name: Generate CodeQL Scan Summary
      shell: bash
      env:
        INPUT_SARIF_DIR: ${{ inputs.sarif-input }}
        HTML_ARTIFACT_URL: ${{ steps.upload-sarif-html.outputs.artifact-url }}
        SARIF_ARTIFACT_URL: ${{ steps.upload-sarif.outputs.artifact-url }}
        SBOM_ARTIFACT_URL: ${{ steps.upload-sbom.outputs.artifact-url }}
        SECURITY_REPORTS_ARTIFACT_URL: ${{ steps.upload-security-reports.outputs.artifact-url }}
        SBOM_ATTESTATION_URL: ${{ steps.attest-sbom.outputs.attestation-url }}
        PROVENANCE_ATTESTATION_URL: ${{ steps.attest-provenance.outputs.attestation-url }}
        SBOM_GENERATED: ${{ steps.generate-sbom.outcome == 'success' && 'true' || 'false' }}
        ADVANCED_SECURITY_ENABLED: ${{ steps.advanced-security.outcome == 'success' && 'true' || 'false' }}
        SCORECARD_ENABLED: ${{ steps.scorecard.outcome == 'success' && 'true' || 'false' }}
        GITHUB_REPO_OWNER: ${{ github.repository_owner }}
      run: |
        SARIF_DIR="$INPUT_SARIF_DIR"
        if [ -z "$SARIF_DIR" ]; then
          SARIF_DIR="${CODEQL_ACTION_SARIF_RESULTS_OUTPUT_DIR}"
        fi

        # Find SARIF files
        SARIF_FILES=($(find "$SARIF_DIR" -maxdepth 1 -name "*.sarif" -type f))
        SARIF_COUNT=${#SARIF_FILES[@]}

        if [ "$SARIF_COUNT" -eq 0 ]; then
          echo "No SARIF file found for summary generation"
          exit 0
        fi

        if [ "$SARIF_COUNT" -gt 1 ]; then
          echo "::warning::Multiple SARIF files found ($SARIF_COUNT). Summary generation for multiple files is not supported. Using the first file: ${SARIF_FILES[0]}"
        fi

        SARIF_FILE="${SARIF_FILES[0]}"
        BASENAME=$(basename "$SARIF_FILE" .sarif)
        HTML_FILENAME="sarif_${BASENAME}.html"
        SARIF_FILENAME=$(basename "$SARIF_FILE")
        SBOM_FILENAME="sbom.spdx.json"

        # Extract information from SARIF file
        CODEQL_VERSION=$(jq -r '.runs[0].tool.driver.semanticVersion // "N/A"' "$SARIF_FILE")

        # Extract language from automationDetails.id (format: "/language:actions/" -> "actions")
        CODEQL_LANGUAGE=$(jq -r '.runs[0].automationDetails.id // "N/A" |
          if . == "N/A" then "N/A"
          else gsub("^/language:"; "") | gsub("/$"; "") | ascii_upcase
          end' "$SARIF_FILE")

        # Find build mode from toolExecutionNotifications
        BUILD_MODE=$(jq -r '
          .runs[0].invocations[0].toolExecutionNotifications[] |
          select(.descriptor.id == "cli/build-mode") |
          .properties.attributes.buildMode // "N/A"
        ' "$SARIF_FILE")

        # Count extracted files (count notifications with this ID pattern for any language)
        EXTRACTED_FILES=$(jq -r '
          [.runs[0].invocations[0].toolExecutionNotifications[] |
          select(.descriptor.id | contains("/diagnostics/successfully-extracted-files"))] | length
        ' "$SARIF_FILE")

        # Count detected files (count notifications with this ID pattern for any language)
        DETECTED_FILES=$(jq -r '
          [.runs[0].invocations[0].toolExecutionNotifications[] |
          select(.descriptor.id | startswith("cli/expected-extracted-files/"))] | length
        ' "$SARIF_FILE")

        # Extract CodeQL Query Suite (only if it's a builtin suite)
        QUERY_SUITE=$(jq -r '
          .runs[0].properties.codeqlConfigSummary.queries[] |
          select(.type == "builtinSuite") |
          .uses // empty
        ' "$SARIF_FILE" | head -n 1)
        if [ -z "$QUERY_SUITE" ]; then
          QUERY_SUITE="N/A"
        fi

        # Count results by severity level (joining with rule definitions)
        TOTAL_RESULTS=$(jq -r '[.runs[0].results[]] | length' "$SARIF_FILE")

        # Create a map of rule IDs to levels and security-severity, then count results by level
        # Only count results that do NOT have security-severity (those are counted in security findings)
        ERROR_RESULTS=$(jq -r '
          (.runs[0].tool.extensions[0].rules | map({
            (.id): {
              level: .defaultConfiguration.level,
              securitySeverity: (.properties."security-severity" // null | tonumber?)
            }
          }) | add) as $ruleMap |
          [.runs[0].results[] |
            $ruleMap[.ruleId] as $rule |
            select($rule.securitySeverity == null and $rule.level == "error")
          ] | length
        ' "$SARIF_FILE")

        WARNING_RESULTS=$(jq -r '
          (.runs[0].tool.extensions[0].rules | map({
            (.id): {
              level: .defaultConfiguration.level,
              securitySeverity: (.properties."security-severity" // null | tonumber?)
            }
          }) | add) as $ruleMap |
          [.runs[0].results[] |
            $ruleMap[.ruleId] as $rule |
            select($rule.securitySeverity == null and $rule.level == "warning")
          ] | length
        ' "$SARIF_FILE")

        NOTE_RESULTS=$(jq -r '
          (.runs[0].tool.extensions[0].rules | map({
            (.id): {
              level: .defaultConfiguration.level,
              securitySeverity: (.properties."security-severity" // null | tonumber?)
            }
          }) | add) as $ruleMap |
          [.runs[0].results[] |
            $ruleMap[.ruleId] as $rule |
            select($rule.securitySeverity == null and $rule.level == "note")
          ] | length
        ' "$SARIF_FILE")

        # Count security findings by CVSS severity (using security-severity property)
        # Only count results that have security-severity defined
        CRITICAL_SECURITY=$(jq -r '
          (.runs[0].tool.extensions[0].rules | map({
            (.id): {
              securitySeverity: (.properties."security-severity" // null | tonumber?)
            }
          }) | add) as $ruleMap |
          [.runs[0].results[] |
            $ruleMap[.ruleId] as $rule |
            select($rule.securitySeverity != null and $rule.securitySeverity >= 9.0)
          ] | length
        ' "$SARIF_FILE")

        HIGH_SECURITY=$(jq -r '
          (.runs[0].tool.extensions[0].rules | map({
            (.id): {
              securitySeverity: (.properties."security-severity" // null | tonumber?)
            }
          }) | add) as $ruleMap |
          [.runs[0].results[] |
            $ruleMap[.ruleId] as $rule |
            select($rule.securitySeverity != null and $rule.securitySeverity >= 7.0 and $rule.securitySeverity < 9.0)
          ] | length
        ' "$SARIF_FILE")

        MEDIUM_SECURITY=$(jq -r '
          (.runs[0].tool.extensions[0].rules | map({
            (.id): {
              securitySeverity: (.properties."security-severity" // null | tonumber?)
            }
          }) | add) as $ruleMap |
          [.runs[0].results[] |
            $ruleMap[.ruleId] as $rule |
            select($rule.securitySeverity != null and $rule.securitySeverity >= 4.0 and $rule.securitySeverity < 7.0)
          ] | length
        ' "$SARIF_FILE")

        LOW_SECURITY=$(jq -r '
          (.runs[0].tool.extensions[0].rules | map({
            (.id): {
              securitySeverity: (.properties."security-severity" // null | tonumber?)
            }
          }) | add) as $ruleMap |
          [.runs[0].results[] |
            $ruleMap[.ruleId] as $rule |
            select($rule.securitySeverity != null and $rule.securitySeverity >= 0.1 and $rule.securitySeverity < 4.0)
          ] | length
        ' "$SARIF_FILE")

        # Get environment variables (with defaults if not set)
        ACTION_VERSION="${CODEQL_ACTION_VERSION:-N/A}"
        SCAN_STARTED="${CODEQL_WORKFLOW_STARTED_AT:-N/A}"
        ANALYSIS_KEY="${CODEQL_ACTION_ANALYSIS_KEY:-N/A}"

        # Generate markdown summary
        cat >> $GITHUB_STEP_SUMMARY << EOF
        # :shield: CodeQL Scan Summary - ${CODEQL_LANGUAGE}

        ## CodeQL Scan Information
        | Property | Value |
        |----------|-------|
        | **GitHub Repository** | \`${{ github.repository }}\` |
        | **Ref** | \`${{ github.ref }}\` |
        | **Commit SHA** | \`${{ github.sha }}\` |
        | **Triggered By** | \`${{ github.event_name }}\` |
        | **Runner Environment** | \`${{ runner.environment }}\` |
        | **CodeQL Language** | \`${CODEQL_LANGUAGE}\` |
        | **CodeQL Build Mode** | \`${BUILD_MODE}\` |
        | **CodeQL Query Suite** | \`${QUERY_SUITE}\` |
        | **CodeQL CLI Version** | \`${CODEQL_VERSION}\` |
        | **CodeQL Action Version** | \`${ACTION_VERSION}\` |
        | **CodeQL Analysis Category** | \`${ANALYSIS_KEY}\` |
        | **CodeQL Scan Started** | ${SCAN_STARTED} |


        ## CodeQL Analysis Metrics
        | Metric | Count |
        |--------|-------|
        | **Detected Files** | ${DETECTED_FILES} |
        | **Extracted Files** | ${EXTRACTED_FILES} |

        ## 🔍 Results Summary

        ### Code Security Findings
        | Severity (CVSS) | Count |
        |----------|-------|
        | 🔴 **Critical (9.0-10.0)** | ${CRITICAL_SECURITY} |
        | 🟠 **High (7.0-8.9)** | ${HIGH_SECURITY} |
        | 🟡 **Medium (4.0-6.9)** | ${MEDIUM_SECURITY} |
        | ⚪ **Low (0.1-3.9)** | ${LOW_SECURITY} |

        ### Code Quality Findings
        | Severity | Count |
        |----------|-------|
        | 🔴 **Error** | ${ERROR_RESULTS} |
        | 🟡 **Warning** | ${WARNING_RESULTS} |
        | ⚪ **Note** | ${NOTE_RESULTS} |

        ### Diagnostics
        | Metric | Count |
        |----------|-------|
        | **Total Security + Quality** | ${TOTAL_RESULTS} |

        ## 📦 Artifacts
        - 📊 [HTML Report](${HTML_ARTIFACT_URL}) - \`${HTML_FILENAME}\`
        - 🛡️ [SARIF File](${SARIF_ARTIFACT_URL}) - \`${SARIF_FILENAME}\`
        - 📋 [SBOM](${SBOM_ARTIFACT_URL:-N/A}) - \`${SBOM_FILENAME}\`
        EOF
        
        if [ "${ADVANCED_SECURITY_ENABLED}" = "true" ] || [ "${SCORECARD_ENABLED}" = "true" ]; then
          cat >> $GITHUB_STEP_SUMMARY << EOF
        - 🔒 [Security Reports](${SECURITY_REPORTS_ARTIFACT_URL})
        EOF
        fi
        
        cat >> $GITHUB_STEP_SUMMARY << EOF

        ## 🔐 Attestations
        EOF

        # Add attestation info based on which was generated
        if [ "${SBOM_GENERATED}" = "true" ]; then
          cat >> $GITHUB_STEP_SUMMARY << EOF
        - ✅ [SBOM Attestation](${SBOM_ATTESTATION_URL})

        **Verify Attestations:**
        \`\`\`bash
        # Verify HTML report with SBOM attestation SPDX predicate
        gh attestation verify --owner ${GITHUB_REPO_OWNER} --predicate-type "https://spdx.dev/Document/v2.3" ${HTML_FILENAME}

        # Verify SARIF file with SBOM attestation SPDX predicate
        gh attestation verify --owner ${GITHUB_REPO_OWNER} --predicate-type "https://spdx.dev/Document/v2.3" ${SARIF_FILENAME}
        \`\`\`
        EOF
        else
          cat >> $GITHUB_STEP_SUMMARY << EOF
        - ✅ [Build Provenance Attestation](${PROVENANCE_ATTESTATION_URL})

        **Verify Attestations:**
        \`\`\`bash
        # Verify HTML report with build provenance
        gh attestation verify --owner ${GITHUB_REPO_OWNER} ${HTML_FILENAME}

        # Verify SARIF file with build provenance
        gh attestation verify --owner ${GITHUB_REPO_OWNER} ${SARIF_FILENAME}
        \`\`\`
        EOF
        fi

        # Add Advanced Security status if enabled
        if [ "${ADVANCED_SECURITY_ENABLED}" = "true" ] && [ -f "security-reports/advanced-security-status.json" ]; then
          cat >> $GITHUB_STEP_SUMMARY << EOF

        ## 🛡️ GitHub Advanced Security Status

        EOF
          
          # Extract and display security_and_analysis features
          if jq -e '.security_and_analysis' security-reports/advanced-security-status.json > /dev/null 2>&1; then
            cat >> $GITHUB_STEP_SUMMARY << EOF
        ### Security Features
        | Feature | Status |
        |---------|--------|
        EOF
            
            # Advanced Security
